spring:
  application:
    name: decision-service
  datasource:
    url: ${HINDSIGHT_DB_URL:jdbc:postgresql://localhost:5432/hindsight?currentSchema=decision}
    username: ${HINDSIGHT_DB_USER:hindsight}
    password: ${HINDSIGHT_DB_PASSWORD:hindsight}
  flyway:
    locations: classpath:decision/flyway
    schemas: decision
    default-schema: decision
    create-schemas: true
  kafka:
    bootstrap-servers: ${HINDSIGHT_KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: ${HINDSIGHT_DECISION_CONSUMER_GROUP:decision-service}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

hindsight:
  jwt:
    hmac-secret: ${HINDSIGHT_JWT_SECRET:}
  kafka:
    enabled: true
  outbox:
    relay-enabled: true
    relay-interval-ms: 500
    batch-size: 50
  decision:
    default-policy-id: ${HINDSIGHT_DEFAULT_POLICY_ID:credit-line-increase}
  policy-cache:
    bootstrap-timeout-ms: 30000
  guardrail:
    enabled: true
    window-duration: PT5M
    min-sample-size: 30
    cooldown-duration: PT10M
    evaluation-interval-ms: 5000
    policy-service-base-url: ${HINDSIGHT_POLICY_SERVICE_URL:http://localhost:8081}
    jwt: ${HINDSIGHT_GUARDRAIL_JWT:}
    default-thresholds:
      max-approval-rate-delta: 0.15
      max-shadow-flip-rate: 0.50
      max-error-rate: 0.05
      max-p99-latency-ms: 500

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when_authorized

server:
  port: ${SERVER_PORT:8082}
